{% extends "base.html" %}
{% block title %}{{ card.facts.name if card else "No such project" }}: Hackathon Memory{% endblock %}
{% block main %}
<div class="page">
  <p class="back"><a href="/{% if back_query %}?{{ back_query }}{% endif %}#results">&larr; Back to the search</a></p>
  {% if problem %}
  <p class="problem notice-box" role="alert">{{ problem }}</p>
  {% else %}
  <div class="panel-page">{% include "_panel.html" %}</div>
  {% endif %}
</div>
{% endblock %}
