# Tests on every push to a phase branch or to main, and on every pull request.
# One job, so that the monthly minutes of a private repository last.
# The first run (9 October 2026) took 54 seconds.
#
# The actions are pinned by commit, with the tag in a comment: a tag can be moved, a commit cannot.
# The tags were read with `git ls-remote` on 9 October 2026. They are the newest tags of the
# previous major version, which has been out for a while.
name: ci

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04  # not ubuntu-latest: that label moves to Ubuntu 26 on 19 October 2026
    timeout-minutes: 10

    services:
      # The same database as docker-compose.yml. "trust" means the throwaway container on the
      # runner accepts any password, so no password text is needed in this file.
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hackathon
          POSTGRES_DB: hackathon_memory
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hackathon -d hackathon_memory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      POSTGRES_PASSWORD: unused-with-trust-authentication

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt

      - name: Install the exact versions
        run: python -m pip install -c constraints.txt -e ".[dev]"

      - name: Lint
        run: |
          ruff format --check .
          ruff check .

      - name: Tests
        run: python -m pytest -W error::DeprecationWarning
